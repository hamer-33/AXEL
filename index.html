  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
  var W,H,dpr=Math.min(window.devicePixelRatio||1,2),cs=getComputedStyle(document.documentElement);
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function col(n){return cs.getPropertyValue(n).trim()||'#ec3f7c'}
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  addEventListener('resize',size);size();
  var PAL=[['#f58fb0','#fbbdd0'],['#7ec8f2','#b6e1fa'],['#f3cf5c','#fbeaa6']];
  var MAP=['..DDD...DDD..', '.DWWMD.DWMMD.', 'DWMMMMDMMMMMD', 'DMMMMMMMMMMMD', 'DMMMMMMMMMMMD', 'DMMMMMMMMMMMD', '.DMMMMMMMMMD.', '..DMMMMMMMD..', '...DMMMMMD...', '....DMMMD....', '.....DMD.....', '......D......'];
  var sprites=[],urls=[];
  PAL.forEach(function(p){var c=document.createElement('canvas');c.width=52;c.height=48;var x=c.getContext('2d');
    for(var r=0;r<12;r++)for(var q=0;q<13;q++){var ch=MAP[r][q];if(ch==='.')continue;x.fillStyle=ch==='D'?p[0]:ch==='M'?p[1]:'#fff';x.fillRect(q*4,r*4,4,4)}
    sprites.push(c);urls.push(c.toDataURL())});
  var SB=['...GG.GG...','..GGGGGGG..','.DDDDDDDDD.','DRWRRRRRRRD','DRRRSRRRSRD','DRSRRRSRRRD','.DRRRRRRRD.','.DRRSRRSRD.','..DRRRRRD..','...DRSRD...','....DRD....','.....D.....'],SC={G:'#7cc576',D:'#e8506a',R:'#f98aa0',S:'#fde58a',W:'#fff'};
  (function(){var c=document.createElement('canvas');c.width=44;c.height=48;var x=c.getContext('2d');
    for(var r=0;r<12;r++)for(var q=0;q<11;q++){var ch=SB[r][q];if(ch!=='.'){x.fillStyle=SC[ch];x.fillRect(q*4,r*4,4,4)}}
    sprites.push(c)})();
  var ring=document.getElementById('ring'),i,n=12;
  for(i=0;i<n;i++){var e=document.createElement('i');e.style.setProperty('--a',(360/n*i)+'deg');e.style.setProperty('--s',(i%2?15:22)+'px');e.style.setProperty('--img','url('+urls[i%3]+')');ring.appendChild(e)}
  var stars=[];for(i=0;i<40;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.6,p:Math.random()*6.28,v:.01+Math.random()*.03});
  function heart(x,y,s,c,a){ctx.globalAlpha=a;ctx.imageSmoothingEnabled=false;ctx.drawImage(sprites[c],Math.round(x-s/2),Math.round(y-s*.46),Math.round(s),Math.round(s*(c===3?12/11:12/13)))}
  var parts=[],fly=[],count=0,cnt=document.getElementById('count');
  function pick(){return Math.random()<.25?3:Math.floor(Math.random()*3)}
  function floater(){var s=16+Math.random()*30;parts.push({k:'f',x:Math.random()*W,y:H+s,s:s,vy:.35+Math.random()*1,sw:Math.random()*6.28,sa:.4+Math.random()*1.1,c:pick(),a:.3+Math.random()*.5,r:(Math.random()-.5)*.6})}
  function burst(x,y,m){for(var j=0;j<(m||16);j++){var an=6.28*j/(m||16)+Math.random()*.4,sp=2+Math.random()*4.5;parts.push({k:'b',x:x,y:y,s:14+Math.random()*22,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,c:pick(),a:1,l:1,r:Math.random()-.5})}}
  function target(){var r=stage.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height*.5}}
  function send(sx,sy,delay){
    var t=target();fly.push({sx:sx,sy:sy,tx:t.x,ty:t.y,cx:(sx+t.x)/2+(Math.random()-.5)*220,cy:Math.min(sy,t.y)-90-Math.random()*80,t:-delay,s:26+Math.random()*14,c:pick()});
  }
  var words=['أحبك','حبيبي','أنت كل شيء','عمري','إلى الأبد'],fill=document.getElementById('fill');
  function arrive(x,y){
    burst(x,y,22);count++;cnt.textContent=count.toLocaleString('ar-EG');
    var w=document.createElement('div');w.className='word';w.textContent=words[count%words.length];w.style.left=(x+(Math.random()-.5)*120)+'px';w.style.top=(y+20)+'px';w.style.fontSize=(18+Math.random()*10)+'px';document.body.appendChild(w);setTimeout(function(){w.remove()},2300);
    fill.style.width=(count%20===0?100:(count%20)*5)+'%';
    if(count%20===0){for(var z=0;z<6;z++)setTimeout(function(){burst(Math.random()*W,Math.random()*H*.7,26)},z*140)}
    if(count===100)setTimeout(showQueen,700);
    stage.animate([{transform:'scale(1)'},{transform:'scale(1.09)'},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});
    if(navigator.vibrate)try{navigator.vibrate(18)}catch(_){}
  }
  var queen=document.getElementById('queen');
  function showQueen(){queen.classList.add('show');for(var z=0;z<12;z++)setTimeout(function(){burst(Math.random()*W,Math.random()*H,28)},z*160)}
  queen.addEventListener('click',function(){queen.classList.remove('show')});
  var last=0,trail=0;
  function tick(t){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle=col('--gold');
    for(var k=0;k<stars.length;k++){var s=stars[k];s.p+=s.v;ctx.globalAlpha=.2+.5*Math.abs(Math.sin(s.p));ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.28);ctx.fill()}
    if(!reduce&&t-last>260){floater();last=t}
    for(var j=parts.length-1;j>=0;j--){
      var p=parts[j];
      if(p.k==='b'){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy=p.vy*.96-.04;p.l-=.013;p.a=Math.max(p.l,0)}
      else{p.y-=p.vy;p.sw+=.02;p.x+=Math.sin(p.sw)*p.sa*.5}
      heart(p.x,p.y,p.s,p.c,p.a,p.r);
      if(p.y<-60||p.l<=0&&p.k==='b')parts.splice(j,1);
    }
    for(var f=fly.length-1;f>=0;f--){
      var o=fly[f];o.t+=.022;if(o.t<0)continue;
      var u=Math.min(o.t,1),v=1-u,x=v*v*o.sx+2*v*u*o.cx+u*u*o.tx,y=v*v*o.sy+2*v*u*o.cy+u*u*o.ty;
      heart(x,y,o.s*(1-.35*u),o.c,1,u*3);
      if(Math.random()<.5)parts.push({k:'b',x:x,y:y,s:9+Math.random()*6,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,c:pick(),a:.8,l:.5,r:0});
      if(u>=1){arrive(o.tx,o.ty);fly.splice(f,1)}
    }
    ctx.globalAlpha=1;requestAnimationFrame(tick);
  }
  if(reduce){for(i=0;i<14;i++){floater();parts[i].y=Math.random()*H}}
  requestAnimationFrame(tick);
  var btn=document.getElementById('send');
  btn.addEventListener('click',function(){
    var r=btn.getBoundingClientRect(),sx=r.left+r.width/2,sy=r.top+r.height/2;
    for(var q=0;q<5;q++)send(sx+(Math.random()-.5)*40,sy,q*.12);
  });
  addEventListener('pointerdown',function(e){if(btn.contains(e.target))return;burst(e.clientX,e.clientY,14)});
  addEventListener('pointermove',function(e){
    if(reduce||e.timeStamp-trail<70)return;trail=e.timeStamp;
    parts.push({k:'b',x:e.clientX,y:e.clientY,s:12+Math.random()*8,vx:(Math.random()-.5)*.6,vy:-.6-Math.random(),c:pick(),a:.9,l:.9,r:Math.random()-.5});
  });
})();
</script>
</body>
